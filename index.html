<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <section id="hero-view" class="view" aria-label="Welcome screen">
            <div class="hero-center">
                <h1>TaskFlow</h1>
                <div class="checkmark-icon">✓</div>
            </div>
            <button id="btn-start">Get Started</button>
        </section>

        <section id="dashboard-view" class="view hidden" aria-label="Task dashboard">
            <h2>TaskFlow</h2>

            <div class="progress-section">
                <p>Progress: <span id="progress-percentage">0%</span></p>
                <div class="progress-bar" role="progressbar" id="progress-bar" aria-valuenow="0" aria-valuemin="0"
                    aria-valuemax="100">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search Task Here">
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="in-progress">In Progress</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <ul id="tasks-container"></ul>

            <button id="btn-go-create">New Task</button>
        </section>

        <section id="form-view" class="view hidden" aria-label="Create task form">
            <div class="form-header">
                <button id="btn-cancel" class="back-btn" type="button" aria-label="Go back">←</button>
                <h2 class="form-title">Create Task</h2>
            </div>

            <form id="task-form">
                <h3 class="form-subtitle">New Objective</h3>
                <p class="form-description">Define your next milestone with precision.</p>

                <label for="title" class="field-label">TITLE</label>
                <input type="text" id="title" placeholder="What needs to be done?">

                <label for="description" class="field-label">DESCRIPTION</label>
                <textarea id="description" placeholder="Add context, sub-tasks, or notes..."></textarea>

                <div class="form-actions">
                    <button type="button" class="pill-btn">Set Due Date</button>
                    <button type="button" class="pill-btn">Add Category</button>
                </div>

                <div class="focus-banner">
                    <span class="focus-badge">Focus Mode Active</span>
                </div>

                <button type="submit">Create Task</button>
            </form>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
